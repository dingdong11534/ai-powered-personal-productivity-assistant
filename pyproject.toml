[project]
name = "personal-assistant"
version = "0.1.0"
description = "Local, modular AI-powered personal productivity assistant."
requires-python = ">=3.11"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: pyflakes+pycodestyle core errors. I: import sorting. UP: pyupgrade
# (modern syntax). B: bugbear (common bug patterns). Kept intentionally
# small — this project prefers a few high-signal rule groups over a large
# default rule set that mostly nags about style.
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
